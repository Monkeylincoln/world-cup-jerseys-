<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Draft 15</title>
  <meta name="description" content="Draft your XI from random teams, with 5 free rerolls.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,500;0,600;0,700;0,800;1,700;1,800&family=Titillium+Web:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="bg-streaks" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand"><span class="brand-mark">D15</span><span class="brand-text">DRAFT <b>15</b></span></div>
    <nav class="tabs" id="tabs">
      <span class="bumper">Q</span>
      <button class="tab" data-tab="home">Home</button>
      <button class="tab" data-tab="setup">Play</button>
      <button class="tab" data-tab="squads">My Squads</button>
      <button class="tab" data-tab="teams">Teams</button>
      <button class="tab" data-tab="howto">How To Play</button>
      <span class="bumper">E</span>
    </nav>
    <div class="profile">
      <div class="profile-name">Manager</div>
      <div class="profile-sub" id="profile-sub">0 Titles</div>
    </div>
  </header>

  <main id="screen" class="screen"></main>

  <footer class="hints" id="hints"></footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
