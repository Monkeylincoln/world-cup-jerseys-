<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#02060d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NextHalf">
  <title>NextHalf</title>
  <meta name="description" content="Spin for a team, draft your XI with 5 free rerolls, then play the Premier League, Champions League or World Cup.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,500;0,600;0,700;0,800;1,700;1,800&family=Titillium+Web:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="bg-streaks" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand"><span class="brand-mark">NH</span><span class="brand-text">NEXT<b>HALF</b></span><span class="retro-tag">RETRO 14/15</span></div>
    <nav class="tabs" id="tabs">
      <span class="bumper">Q</span>
      <button class="tab" data-tab="home">Home</button>
      <button class="tab" data-tab="setup">Play</button>
      <button class="tab" data-tab="squads"><span class="lg-label">My Squads</span><span class="sm-label">Squads</span></button>
      <button class="tab" data-tab="teams"><span class="lg-label">Database</span><span class="sm-label">Teams</span></button>
      <button class="tab" data-tab="howto"><span class="lg-label">How To Play</span><span class="sm-label">Help</span></button>
      <span class="bumper">E</span>
    </nav>
    <div class="profile">
      <div class="profile-name">Manager</div>
      <div class="profile-sub" id="profile-sub"></div>
    </div>
  </header>

  <main id="screen" class="screen"></main>

  <footer class="hints" id="hints"></footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/data.js"></script>
  <script src="js/data-now.js"></script>
  <script src="js/data-retro.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
